<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Language Translator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <header>
        <div class="icon">🌐</div>

        <h1>AI Language Translator</h1>

        <p>
            Translate text instantly between multiple languages
        </p>
    </header>


    <main class="translator-box">

        <!-- LANGUAGE SELECTION -->

        <div class="language-section">

            <div class="language-box">

                <label for="sourceLanguage">
                    From
                </label>

                <select id="sourceLanguage">

                    <option value="en">English</option>

                    <!-- Indian Languages -->

                    <option value="hi">Hindi</option>
                    <option value="te">Telugu</option>
                    <option value="ta">Tamil</option>
                    <option value="kn">Kannada</option>
                    <option value="ml">Malayalam</option>
                    <option value="bn">Bengali</option>
                    <option value="mr">Marathi</option>
                    <option value="gu">Gujarati</option>
                    <option value="pa">Punjabi</option>
                    <option value="ur">Urdu</option>
                    <option value="or">Odia</option>
                    <option value="ne">Nepali</option>
                    <option value="si">Sinhala</option>

                    <!-- European Languages -->

                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="nl">Dutch</option>
                    <option value="pl">Polish</option>
                    <option value="ro">Romanian</option>
                    <option value="el">Greek</option>
                    <option value="cs">Czech</option>
                    <option value="hu">Hungarian</option>
                    <option value="sv">Swedish</option>
                    <option value="da">Danish</option>
                    <option value="fi">Finnish</option>
                    <option value="no">Norwegian</option>
                    <option value="uk">Ukrainian</option>
                    <option value="bg">Bulgarian</option>
                    <option value="sr">Serbian</option>
                    <option value="sk">Slovak</option>
                    <option value="sl">Slovenian</option>
                    <option value="tr">Turkish</option>

                    <!-- Asian Languages -->

                    <option value="zh-CN">
                        Chinese (Simplified)
                    </option>

                    <option value="zh-TW">
                        Chinese (Traditional)
                    </option>

                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="th">Thai</option>
                    <option value="vi">Vietnamese</option>
                    <option value="id">Indonesian</option>
                    <option value="ms">Malay</option>
                    <option value="tl">Filipino</option>
                    <option value="fa">Persian</option>
                    <option value="he">Hebrew</option>
                    <option value="sw">Swahili</option>

                </select>

            </div>


            <button id="swapButton"
                    class="swap-button"
                    title="Swap languages">

                ⇄

            </button>


            <div class="language-box">

                <label for="targetLanguage">
                    To
                </label>

                <select id="targetLanguage">

                    <option value="hi">Hindi</option>
                    <option value="en">English</option>

                    <!-- Indian Languages -->

                    <option value="te">Telugu</option>
                    <option value="ta">Tamil</option>
                    <option value="kn">Kannada</option>
                    <option value="ml">Malayalam</option>
                    <option value="bn">Bengali</option>
                    <option value="mr">Marathi</option>
                    <option value="gu">Gujarati</option>
                    <option value="pa">Punjabi</option>
                    <option value="ur">Urdu</option>
                    <option value="or">Odia</option>
                    <option value="ne">Nepali</option>
                    <option value="si">Sinhala</option>

                    <!-- European Languages -->

                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="nl">Dutch</option>
                    <option value="pl">Polish</option>
                    <option value="ro">Romanian</option>
                    <option value="el">Greek</option>
                    <option value="cs">Czech</option>
                    <option value="hu">Hungarian</option>
                    <option value="sv">Swedish</option>
                    <option value="da">Danish</option>
                    <option value="fi">Finnish</option>
                    <option value="no">Norwegian</option>
                    <option value="uk">Ukrainian</option>
                    <option value="bg">Bulgarian</option>
                    <option value="sr">Serbian</option>
                    <option value="sk">Slovak</option>
                    <option value="sl">Slovenian</option>
                    <option value="tr">Turkish</option>

                    <!-- Asian Languages -->

                    <option value="zh-CN">
                        Chinese (Simplified)
                    </option>

                    <option value="zh-TW">
                        Chinese (Traditional)
                    </option>

                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="th">Thai</option>
                    <option value="vi">Vietnamese</option>
                    <option value="id">Indonesian</option>
                    <option value="ms">Malay</option>
                    <option value="tl">Filipino</option>
                    <option value="fa">Persian</option>
                    <option value="he">Hebrew</option>
                    <option value="sw">Swahili</option>

                </select>

            </div>

        </div>


        <!-- TEXT AREAS -->

        <div class="text-area-section">

            <div class="text-box">

                <textarea
                    id="inputText"
                    maxlength="500"
                    placeholder="Enter text to translate..."></textarea>

                <span id="characterCount">
                    0 / 500
                </span>

            </div>


            <div class="text-box result-box">

                <textarea
                    id="translatedText"
                    placeholder="Translation will appear here..."
                    readonly></textarea>

                <button id="copyButton"
                        class="copy-button">

                    📋 Copy

                </button>

            </div>

        </div>


        <!-- TRANSLATE BUTTON -->

        <button id="translateButton"
                class="translate-button">

            Translate

        </button>


        <!-- CLEAR BUTTON -->

        <button id="clearButton"
                class="clear-button">

            Clear

        </button>


        <!-- STATUS -->

        <p id="statusMessage"></p>

    </main>


    <footer>

        <p>
            AI translator tools
        </p>

    </footer>

</div>


<script src="{{ url_for('static', filename='script.js') }}">
</script>

</body>

</html>
